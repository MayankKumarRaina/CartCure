name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping application health endpoint
        env:
          APP_URL: ${{ vars.APP_URL || vars.DAWADAAM_URL || 'https://dawadaam.in' }}
        run: curl --fail --silent --show-error "$APP_URL/api/health"
