name: Daily Price Scraper

on:
  schedule:
    # 00:30 UTC is exactly 6:00 AM IST. Runs every single day.
    - cron: '30 0 * * *'
  # This line allows you to click a button in GitHub to run it manually whenever you want
  workflow_dispatch:

jobs:
  scrape-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install supabase playwright
          
      - name: Install Playwright headless browser
        run: python -m playwright install chromium
        
      - name: Execute scraper
        run: python scraper/update_prices.py